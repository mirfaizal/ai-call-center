# Model Control Plane (MCP) Configuration
# Controls model selection, cost management, and fallback logic

models:
  primary:
    provider: openai
    name: gpt-4o
    max_tokens: 2000
    temperature: 0.2
  fallback:
    provider: openai
    name: gpt-3.5-turbo
    max_tokens: 2000
    temperature: 0.2

transcription:
  primary:
    provider: openai
    model: whisper-1
  fallback:
    provider: openai
    model: whisper-1

routing:
  max_retries: 2
  fallback_on_error: true
  log_level: INFO

cost_controls:
  max_tokens_per_call: 4000
  enable_caching: true

observability:
  log_results: true
  log_performance: true
  output_dir: logs/
